aid: ezcater
name: ezCater
description: >-
  ezCater is a corporate and workplace catering marketplace that connects businesses
  with a nationwide network of local restaurants and caterers. Founded in 2007 and
  headquartered in Boston, the platform lets organizations order food online for
  meetings, events, and recurring team meals, and layers workplace-food management
  on top: meal programs, per-team and per-location spend controls, group ordering,
  delivery coordination, and centralized invoicing and reporting. ezCater serves
  companies of every size across the United States and is backed by ICONIQ Capital,
  Insight Partners, Lightspeed Venture Partners, and the SoftBank Vision Fund. The
  company does not publish a public developer API; integrations are arranged through
  its enterprise and partner sales channels. This API Evangelist profile tracks the
  company's public developer, security, and trust surface.
